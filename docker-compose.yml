version: "3.8"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app  
    environment:
      - VITE_DEV=true    

  backend:
    build: ./backend
    ports:
      - "5001:5001"
    volumes:
      - ./backend:/app  
    environment:
      - FLASK_ENV=development  
